<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel operacional · RJ15</title>
<style>
  :root{
    --bg:#f1f3f8; --card:#fff; --ink:#18212f; --mut:#667085; --line:#e2e6ee;
    --navy:#14213d; --accent:#ff6a00; --red:#dc2626; --green:#16a34a; --amber:#d97706;
    --r:10px; --sh:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  button,input,select{font:inherit}

  /* topo */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--navy);color:#fff}
  #burger{width:42px;height:42px;border:0;border-radius:var(--r);background:rgba(255,255,255,.1);color:#fff;font-size:22px;cursor:pointer}
  #burger:hover{background:rgba(255,255,255,.2)}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:18px;letter-spacing:.2px}
  .brand small{opacity:.7;font-size:12px}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
  #updated{font-size:12px;opacity:.75}
  .top-pct{font-weight:800;font-size:16px;padding:6px 12px;border-radius:var(--r);background:rgba(255,255,255,.12)}
  .top-pct.g{background:var(--green)} .top-pct.y{background:var(--amber)} .top-pct.r{background:var(--red)}

  /* abas */
  .tabs{display:flex;gap:6px;padding:12px 18px 0;overflow-x:auto}
  .tab{border:1px solid var(--line);background:#fff;color:var(--mut);padding:9px 16px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:0}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{padding:16px 18px 40px;max-width:1400px;margin:0 auto}

  /* cartões */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px}
  .count{background:var(--bg);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--mut);margin-left:6px}
  .mut{color:var(--mut)}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  .grid .card{margin-bottom:0}
  .g-hero{grid-template-columns:minmax(300px,1.1fr) 2fr}
  .g-kpi{grid-template-columns:repeat(3,1fr)}
  .g-kpi3{grid-template-columns:repeat(3,1fr)}
  .g-2{grid-template-columns:1fr 1fr}
  .g-routes{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  @media(max-width:900px){.g-hero,.g-2{grid-template-columns:1fr}.g-kpi,.g-kpi3{grid-template-columns:repeat(2,1fr)}}

  .meta{border-left:6px solid var(--c)}
  .meta-h{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-weight:600;font-size:13px}
  .meta-v{font-size:54px;font-weight:800;color:var(--c);line-height:1.1;margin:6px 0}
  .bar{position:relative;height:12px;background:var(--bg);border-radius:var(--r);overflow:visible}
  .bar i{display:block;height:100%;background:var(--c);border-radius:var(--r)}
  .bar b{position:absolute;top:-4px;width:3px;height:20px;background:var(--navy);border-radius:2px;transform:translateX(-3px)}
  .meta-s{margin-top:10px;color:var(--mut);font-size:12.5px}
  .pill{background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .kpi{border-top:4px solid var(--c);padding:12px 14px}
  .kpi-t{color:var(--mut);font-size:12.5px;font-weight:600}
  .kpi-v{font-size:30px;font-weight:800;color:var(--c)}
  .kpi-s{font-size:12px;color:var(--mut)}
  .chart{height:260px;position:relative}

  /* tabelas */
  .tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:560px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:#f7f8fb;text-align:left;padding:9px 11px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 11px;border-bottom:1px solid #eef0f5;white-space:nowrap}
  tr.click{cursor:pointer} tr.click:hover td{background:#fafbfe}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}

  /* filtros */
  .filters,.row{display:flex;gap:10px;align-items:center}
  .row.between{justify-content:space-between} .row.end{justify-content:flex-end;margin-top:14px} .row.center{justify-content:center;margin-top:14px} .row.wrap{flex-wrap:wrap}
  .filters{margin-bottom:10px;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 14px;cursor:pointer;color:var(--mut);font-weight:600}
  .seg button.on{background:var(--navy);color:#fff}
  .search{flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);outline:none}
  .search:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:600;color:var(--ink)}
  .chip b{margin-left:6px;background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px}
  .chip.on{border-color:var(--accent);background:#fff4ec}
  .chip.static{cursor:default}
  .chip b.r{background:#fee2e2;color:var(--red)} .chip b.g{background:#dcfce7;color:var(--green)}

  /* botões */
  .btn{display:inline-block;border:0;background:var(--accent);color:#fff;padding:9px 16px;border-radius:var(--r);cursor:pointer;font-weight:700;text-align:center}
  .btn:hover{filter:brightness(.95)}
  .btn.sm{padding:6px 12px;font-size:12.5px}
  .btn.lg{padding:13px 26px;font-size:15px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.navy{background:var(--navy)}

  /* prioridade */
  .route{background:#fff;border-radius:var(--r);padding:14px;border:3px solid var(--line);box-shadow:var(--sh)}
  .route.red{border-color:var(--red);box-shadow:0 0 0 4px rgba(220,38,38,.12)}
  .route.green{border-color:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.10)}
  .route-h{display:flex;justify-content:space-between;align-items:center}
  .route-h b{font-size:17px}
  .onda{background:var(--navy);color:#fff;font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:700}
  .prio{margin:8px 0 2px;color:var(--red);font-weight:800}
  .okm{margin:8px 0 2px;color:var(--green);font-weight:800}
  .nm{margin:8px 0 2px;color:var(--mut);font-weight:700}
  .route-s{color:var(--mut);font-size:12.5px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:22px}
  .tag{font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:2px 8px;border-radius:20px}
  .mini{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;border:2px solid var(--red);border-radius:var(--r);margin-bottom:8px;font-size:13px}
  .dotc{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
  .dotc.r{background:var(--red)} .dotc.g{background:var(--green)} .dotc.n{background:#9aa3b2}
  .notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 14px;border-radius:var(--r);margin:8px 0}

  .empty{text-align:center;padding:50px 20px}
  .empty-ico{font-size:44px;color:var(--accent)}
  .center-card{text-align:center;padding:36px 20px;max-width:640px;margin:20px auto}
  .center-card .btn{margin-top:10px}

  /* menu lateral */
  #scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  #scrim.show{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;left:0;bottom:0;width:360px;max-width:92vw;background:#fff;z-index:50;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.2)}
  #drawer.open{transform:none}
  .dr-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--navy);color:#fff}
  .dr-h button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:var(--r);width:34px;height:34px;font-size:18px;cursor:pointer}
  #uploads{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
  .dr-f{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .up{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px}
  .up.ok{border-style:solid;border-color:#bbf7d0;background:#f6fef9}
  .up-h{display:flex;justify-content:space-between;align-items:center}
  .up .dot{width:10px;height:10px;border-radius:50%;background:#cbd2dd}
  .up.ok .dot{background:var(--green)}
  .up-s{font-size:12px;color:var(--mut)}
  .up-f{font-size:12.5px;margin:6px 0 8px;word-break:break-all}
  .up-b{display:flex;gap:8px;flex-wrap:wrap}

  /* modal */
  #modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  #modal.show{display:flex}
  #modal-body{background:#fff;border-radius:var(--r);padding:20px;width:min(900px,100%);max-height:90vh;overflow:auto}
  #modal-body h3{margin:0 0 8px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12.5px}
  .form select{padding:7px;border:1px solid var(--line);border-radius:8px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .facts div{background:var(--bg);border-radius:var(--r);padding:8px 12px}
  .facts span{display:block;font-size:11.5px;color:var(--mut)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:var(--r);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
  .toast.show{opacity:1;transform:translate(-50%,0)} .toast.ok{background:var(--green)} .toast.err{background:var(--red)} .toast.warn{background:var(--amber)}
</style>
</head>
<body>

<header class="top">
  <button id="burger" aria-label="Abrir menu">☰</button>
  <div class="brand"><b>Painel operacional</b><small>RJ15 · Inventário de gaiolas</small></div>
  <div class="top-r">
    <span id="updated">Sem dados</span>
    <span id="top-pct" class="top-pct" title="Gaiolas fechadas (meta 100%)">–</span>
    <button class="btn sm navy" id="btn-pdf" style="border:1px solid rgba(255,255,255,.3)">Gerar PDF</button>
  </div>
</header>

<aside id="drawer" aria-label="Menu">
  <div class="dr-h"><b>Carregar planilhas</b><button id="drawer-x" aria-label="Fechar">✕</button></div>
  <div id="uploads"></div>
  <div class="dr-f">
    <small class="mut">Os dados ficam salvos neste navegador. Para atualizar, carregue as planilhas novamente: o painel recalcula na hora.</small>
    <button class="btn sm ghost" id="btn-limpar">Limpar dados</button>
  </div>
</aside>
<div id="scrim"></div>

<nav class="tabs">
  <button class="tab on" data-tab="dashboard">Dashboard</button>
  <button class="tab" data-tab="gaiolas">Gaiolas</button>
  <button class="tab" data-tab="auditoria">Auditoria de gaiola</button>
  <button class="tab" data-tab="conclusao">Conclusão de auditoria</button>
  <button class="tab" data-tab="prioridade">Prioridade</button>
  <button class="tab" data-tab="relatorio">Relatório</button>
</nav>

<main id="view"></main>

<div id="modal"><div id="modal-body"></div></div>
<div id="toast" class="toast"></div>

<!-- Bibliotecas (carregadas da internet): Excel, gráficos e PDF -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<!-- Estrutura / lógica do projeto -->
<script src="app.js"></script>
</body>
</html>
